[package]
name = "mcpv"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"

[dev-dependencies]
axum = "0.8"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["net", "signal", "sync", "time", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
