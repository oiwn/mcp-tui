session_name: mcp-tui
environment:
  RUST_LOG: info
shell_command_before: "clear"
windows:
  - window_name: code
    focus: true
    start-directory: ./
    panes:
      - shell_command:
        - hx
  - window_name: agent
    start-directory: ./
    panes:
      - shell_command:
        - echo "run agent there"
  - window_name: cmd1
    start-directory: ./
    panes:
      - shell_command:
        - eza --long
  - window_name: cmd2
    panes:
      - shell_command:
        - eza --long
  - window_name: yazi
    panes:
      - shell_command:
        - eza --long
